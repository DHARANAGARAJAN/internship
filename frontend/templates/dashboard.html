<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
            width: 350px;
        }
        h1 { color: #333; }
        p { color: #666; }
        .btn {
            display: block;
            margin: 12px auto;
            padding: 12px 20px;
            font-size: 16px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: 0.3s;
            width: 150px;
        }
        .btn:hover { opacity: 0.9; }
        .btn-primary { background: #3498db; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-success { background: #2ecc71; color: white; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ username }}!</h1>
        <p>You have registered for the {{ course }} course.</p>
        <h3>Quick Actions</h3>

        <!-- Start Button -->
        <a href="{% url 'c1_page' %}">
            <button class="btn btn-success">Start →</button>
        </a>

        <!-- View Quiz -->
        <a href="{% url 'quizpro' %}">
            <button class="btn btn-primary">View Quiz</button>
        </a>

        <!-- Logout -->
        <a href="{% url 'logout' %}">
            <button class="btn btn-danger">Logout</button>
        </a>
    </div>
</body>
</html>
